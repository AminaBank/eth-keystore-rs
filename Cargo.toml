[package]
name = "eth-keystore"
version = "0.5.0"
authors = ["Rohit Narurkar <rohit.narurkar@protonmail.com>"]
edition = "2018"
license = "Apache-2.0"
description = "A minimalist library to interact with encrypted JSON keystores"
documentation = "https://docs.rs/eth-keystore"
repository = "https://github.com/roynalnaruto/eth-keystore-rs"
readme = "README.md"
keywords = ["ethereum", "web3", "wallet"]
exclude = ["tests/test-keys/*"]

[dependencies]
aes = "0.9"
ctr = "0.10"
digest = "0.11"
hex = "0.4.2"
hmac = "0.13.0"
pbkdf2 = { version = "0.13", default-features = false }
rand = "0.10"
scrypt = { version = "0.12.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sha3 = "0.11"
thiserror = { version = "2", default-features = false }
uuid = { version = "1.0", features = ["serde", "v4"] }

# feature = "geth-compat"
ethereum-types = { version = "0.16", optional = true }
k256 = { version = "0.13", optional = true }

[features]
geth-compat = ["ethereum-types", "k256", "k256/ecdsa"]
